<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8fd5e8" />
    <title>Survival Game — Island Prototype</title>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="Prototype 3D d'une île low-poly"></canvas>
    <aside class="inventory" aria-label="Inventaire">
      <div>Bois : <span id="inventory-wood">0</span></div>
      <div>Pierre : <span id="inventory-stone">0</span></div>
      <div>Nourriture : <span id="inventory-food">0</span></div>
    </aside>
    <aside id="building-panel" class="building-panel" hidden>
      <strong id="building-name"></strong>
      <div class="building-cost">
        Coût :<br />
        Bois : <span id="building-cost-wood"></span><br />
        Pierre : <span id="building-cost-stone"></span>
      </div>
      <div>Tab : changer</div>
      <div>Clic gauche : construire</div>
      <div>R : tourner</div>
      <div>Échap : annuler</div>
      <div id="building-status" class="building-status"></div>
    </aside>
    <aside id="crafting-panel" class="crafting-panel" hidden>
      <strong>ÉTABLI</strong>
      <div
        id="crafting-recipe-stone-axe"
        class="crafting-recipe is-selected"
      >
        <strong id="crafting-recipe-stone-axe-label"></strong>
        <div>
          Bois : <span id="crafting-recipe-stone-axe-wood"></span> — Pierre :
          <span id="crafting-recipe-stone-axe-stone"></span>
        </div>
        <div>
          Possédé : <span id="crafting-recipe-stone-axe-owned">0</span>
        </div>
      </div>
      <div id="crafting-recipe-stone-pickaxe" class="crafting-recipe">
        <strong id="crafting-recipe-stone-pickaxe-label"></strong>
        <div>
          Bois : <span id="crafting-recipe-stone-pickaxe-wood"></span> — Pierre :
          <span id="crafting-recipe-stone-pickaxe-stone"></span>
        </div>
        <div>
          Possédé : <span id="crafting-recipe-stone-pickaxe-owned">0</span>
        </div>
      </div>
      <div id="crafting-progress" class="crafting-progress" hidden>
        <span id="crafting-progress-label"></span>
        <progress
          id="crafting-progress-bar"
          max="1"
          value="0"
          aria-labelledby="crafting-progress-label"
        ></progress>
      </div>
      <div>Tab : changer de recette</div>
      <div>E : fabriquer</div>
      <div>Échap : fermer</div>
      <div id="crafting-status" class="crafting-status" aria-live="polite"></div>
    </aside>
    <div id="interaction-prompt" class="game-message" hidden></div>
    <div id="harvest-progress" class="harvest-progress" hidden>
      <span id="harvest-progress-label"></span>
      <progress
        id="harvest-progress-bar"
        max="1"
        value="0"
        aria-labelledby="harvest-progress-label"
      ></progress>
    </div>
    <div
      id="harvest-feedback"
      class="game-message game-message--feedback"
      aria-live="polite"
      hidden
    ></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
